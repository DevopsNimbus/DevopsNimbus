nearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><style>@keyframes fxd1{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,20px)}}@keyframes fxd2{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-18px)}}@keyframes fxpulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes fxspin{to{transform:rotate(360deg)}}@keyframes fxshine{from{transform:translateX(-168px)}to{transform:translateX(420px)}}.fx-d1{animation:fxd1 18s ease-in-out infinite}.fx-d2{animation:fxd2 22s ease-in-out infinite}.fx-pulse{animation:fxpulse 2.8s ease-in-out infinite}.fx-spin{animation:fxspin 120s linear infinite}.fx-shine{animation:fxshine 9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style>.lf-n{animation:lfn 2.6s ease-in-out infinite}@keyframes lfn{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}.lf-r{animation:lfr 2.2s ease-in-out infinite}@keyframes lfr{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.lf-p{transform-box:fill-box;transform-origin:center;animation:lfp 2.4s ease-out infinite}@keyframes lfp{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.6);opacity:0}}.lf-s{animation:lfs 5.5s ease-in-out infinite}@keyframes lfs{0%{transform:translateX(0)}70%,100%{transform:translateX(1000px)}}.lf-g{animation:lfg 2.8s ease-in-out infinite}@keyframes lfg{0%,100%{opacity:1}50%{opacity:.72}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style>@keyframes vxp{0%,100%{opacity:1}50%{opacity:.55}}.vxp{animation:vxp 2.4s ease-in-out infinite}@keyframes vxb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}.vxb{animation:vxb 2.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="wf"><rect width="420" height="220" rx="14"/></clipPath><linearGradient id="vsk" x1="0.3" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5feff"/><stop offset="0.55" stop-color="#d5f0fa"/><stop offset="1" stop-color="#cad9fb"/></linearGradient><radialGradient id="vskm" cx="1" cy="0.3" r="0.7"><stop offset="0" stop-color="#91d1a2" stop-opacity="0.35"/><stop offset="1" stop-color="#0a9831" stop-opacity="0"/></radialGradient><radialGradient id="vskl" cx="0" cy="1" r="0.8"><stop offset="0" stop-color="#5c4aee" stop-opacity="0.22"/><stop offset="1" stop-color="#0f3fe5" stop-opacity="0"/></radialGradient><pattern id="vgr" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 L20 0 L40 10 L20 20Z" fill="none" stroke="#0a2540" stroke-opacity="0.045"/></pattern></defs><g clip-path="url(#wf)"><rect width="420" height="220" fill="url(#vsk)"/><rect width="420" height="220" fill="url(#vskm)"/><rect width="420" height="220" fill="url(#vskl)"/><rect width="420" height="220" fill="url(#vgr)"/></g><g><g class="vxb"><path d="M36.0,25.0 L44.0,29.0 L36.0,33.0 L28.0,29.0Z" fill="#0a9831"/><path d="M28.0,29.0 L36.0,33.0 L36.0,39.0 L28.0,35.0Z" fill="#088029"/><path d="M36.0,33.0 L44.0,29.0 L44.0,35.0 L36.0,39.0Z" fill="#bae2c5"/></g><text x="54" y="40" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0a2540">Github stats</text><text x="392" y="40" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.6" fill="#0a9831">PUBLIC ACTIVITY</text><line x1="28" y1="52" x2="392" y2="52" stroke="#0a9831" stroke-opacity="0.35"/><rect x="154" y="72" width="1" height="128" fill="#0a2540" fill-opacity="0.07"/><rect x="280" y="72" width="1" height="128" fill="#0a2540" fill-opacity="0.07"/><rect x="28" y="136" width="364" height="1" fill="#0a2540" fill-opacity="0.05"/><text x="28"