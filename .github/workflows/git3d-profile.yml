name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D Orbit v3
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Git3D Orbit v3
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Verifying Git3D Orbit v3"
          echo "========================================"

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Generated SVG contains testusername."
            exit 1
          fi

          if ! grep -q "DevopsNimbus" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain DevopsNimbus."
            exit 1
          fi

          if ! grep -q "<svg" profile/git3d.svg; then
            echo "ERROR: Generated file is not an SVG."
            exit 1
          fi

          if ! grep -q "orbit universe" profile/git3d.svg; then
            echo "ERROR: Orbit universe marker is missing."
            exit 1
          fi

          if ! grep -q "depth-based GitHub activity universe" profile/git3d.svg; then
            echo "ERROR: Orbit v3 depth renderer is missing."
            exit 1
          fi

          if ! grep -q "depthHaze" profile/git3d.svg; then
            echo "ERROR: Orbit v3 depth haze is missing."
            exit 1
          fi

          # PR #24 polished renderer checks.
          if ! grep -q "PROFILE" profile/git3d.svg; then
            echo "ERROR: Profile statistics section is missing."
            exit 1
          fi

          if ! grep -q "REPOSITORIES" profile/git3d.svg; then
            echo "ERROR: Repository statistics section is missing."
            exit 1
          fi

          if ! grep -q "LANGUAGES" profile/git3d.svg; then
            echo "ERROR: Languages section is missing."
            exit 1
          fi

          if ! grep -q "ACTIVITY" profile/git3d.svg; then
            echo "ERROR: Activity section is missing."
            exit 1
          fi

          if ! grep -q "repoSphere" profile/git3d.svg; then
            echo "ERROR: Repository sphere gradients are missing."
            exit 1
          fi

          echo ""
          echo "Git3D Orbit v3 verification passed."

      - name: Show Git3D summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Git3D Orbit v3 Summary"
          echo "========================================"

          echo ""
          echo "Generated file:"
          ls -lh profile/git3d.svg

          echo ""
          echo "Profile:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true

          echo ""
          echo "Profile metrics:"
          grep -o '[0-9]* repos · [0-9]* followers · [0-9]* following · [0-9]* activity score' \
            profile/git3d.svg || true

          echo ""
          echo "Renderer:"
          grep -o 'orbit universe' profile/git3d.svg || true
          grep -o 'depth-based GitHub activity universe' profile/git3d.svg || true

          echo ""
          echo "Polished layout:"
          grep -o 'PROFILE' profile/git3d.svg || true
          grep -o 'REPOSITORIES' profile/git3d.svg || true
          grep -o 'LANGUAGES' profile/git3d.svg || true
          grep -o 'ACTIVITY' profile/git3d.svg || true

      # Refresh main before committing the generated artifact.
      # This prevents conflicts with an older generated SVG.
      - name: Refresh repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching latest main..."

          git fetch origin main

          echo "Resetting workspace to latest origin/main..."

          git reset --hard origin/main

      # Generate again after refreshing main.
      - name: Regenerate Git3D Orbit v3
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Git3D verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Performing final verification..."

          test -s profile/git3d.svg

          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg
          grep -q "orbit universe" profile/git3d.svg
          grep -q "depth-based GitHub activity universe" profile/git3d.svg
          grep -q "depthHaze" profile/git3d.svg

          # PR #24 layout.
          grep -q "PROFILE" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "LANGUAGES" profile/git3d.svg
          grep -q "ACTIVITY" profile/git3d.svg

          # PR #24 3D repository spheres.
          grep -q "repoSphere" profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Final SVG contains testusername."
            exit 1
          fi

          echo "Final Git3D Orbit v3 verification passed."

      - name: Commit and push Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes detected."
            exit 0
          fi

          git commit -m "chore: refresh Git3D Orbit v3 profile"

          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo "Git3D Orbit v3 pushed successfully"
          echo "========================================"
