name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V6 visualization
        uses: SandeepKomal/git3d-profile@9445161b50005a5365b104c5ed494b090614963c
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Git3D V6 visualization..."

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg

          # V6 identity
          grep -q "GIT3D CONTRIBUTION UNIVERSE" profile/git3d.svg
          grep -q "365-DAY CONTRIBUTION LANDSCAPE" profile/git3d.svg

          # V6 primary visualization
          grep -q "CONTRIBUTION LANDSCAPE" profile/git3d.svg
          grep -q "365 DAYS" profile/git3d.svg
          grep -q "HEIGHT = DAILY CONTRIBUTION INTENSITY" profile/git3d.svg

          # Core visualization
          grep -q "ACTIVITY CORE" profile/git3d.svg
          grep -q "data-role=\"contribution-landscape\"" profile/git3d.svg
          grep -q "data-role=\"terrain-floor\"" profile/git3d.svg
          grep -q "data-role=\"terrain-columns\"" profile/git3d.svg
          grep -q "data-role=\"terrain-peaks\"" profile/git3d.svg

          # Metrics
          grep -q "CONTRIBUTIONS" profile/git3d.svg
          grep -q "ACTIVE DAYS" profile/git3d.svg
          grep -q "LONGEST STREAK" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "ACTIVITY SCORE" profile/git3d.svg

          echo "Git3D V6 SVG validation passed."

      - name: Show generated visualization summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Git3D V6 Generated Visualization"
          echo "========================================"

          echo ""
          echo "Generated SVG:"
          ls -lh profile/git3d.svg

          echo ""
          echo "SVG title:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true

          echo ""
          echo "Visualization:"
          grep -o 'GIT3D CONTRIBUTION UNIVERSE' profile/git3d.svg || true

          echo ""
          echo "Landscape:"
          grep -o 'CONTRIBUTION LANDSCAPE' profile/git3d.svg || true
          grep -o '365 DAYS' profile/git3d.svg || true

          echo ""
          echo "Core:"
          grep -o 'ACTIVITY CORE' profile/git3d.svg || true

          echo ""
          echo "Metrics:"
          grep -o '<text[^>]*>CONTRIBUTIONS</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>ACTIVE DAYS</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>LONGEST STREAK</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>REPOSITORIES</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>ACTIVITY SCORE</text>' profile/git3d.svg || true

          echo ""
          echo "========================================"
          echo "Git3D V6 validation complete"
          echo "========================================"

      - name: Commit Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
            exit 0
          fi

          git commit -m "chore: refresh Git3D profile"

          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Git3D profile pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Rebasing again..."
            git pull --rebase origin main
          done

          echo "ERROR: Unable to push Git3D profile after 3 attempts."
          exit 1
