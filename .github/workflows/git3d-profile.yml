name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V11 visualization
        uses: SandeepKomal/git3d-profile@<V11-MERGED-COMMIT-SHA>
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating Git3D V11 visualization"
          echo "========================================"

          SVG="profile/git3d.svg"

          # --------------------------------------------------
          # Basic SVG validation
          # --------------------------------------------------

          test -s "$SVG"

          grep -q "<svg" "$SVG"
          grep -q "</svg>" "$SVG"

          # --------------------------------------------------
          # Profile identity
          # --------------------------------------------------

          grep -q "DevopsNimbus" "$SVG"

          # --------------------------------------------------
          # Git3D identity
          # --------------------------------------------------

          grep -q "Git3D" "$SVG"
          grep -q "Contribution Universe" "$SVG"

          # --------------------------------------------------
          # V11 orbital universe structure
          # --------------------------------------------------

          grep -q 'data-role="orbital-system"' "$SVG"
          grep -q 'data-role="repository-nodes"' "$SVG"
          grep -q 'data-role="profile-core"' "$SVG"

          # --------------------------------------------------
          # Activity insights
          # --------------------------------------------------

          grep -q "TOP REPOSITORY" "$SVG"
          grep -q "TOP LANGUAGE" "$SVG"
          grep -q "PEAK DAILY ACTIVITY" "$SVG"
          grep -q "LONGEST STREAK" "$SVG"

          # --------------------------------------------------
          # Profile statistics
          # --------------------------------------------------

          grep -q 'data-role="profile-stats"' "$SVG"

          grep -q "CONTRIBUTIONS" "$SVG"
          grep -q "REPOSITORIES" "$SVG"
          grep -q "STARS" "$SVG"
          grep -q "FORKS" "$SVG"
          grep -q "COLLABORATION" "$SVG"
          grep -q "ACTIVITY SCORE" "$SVG"

          # --------------------------------------------------
          # Prevent accidental test/fixture data
          # --------------------------------------------------

          if grep -q "testusername" "$SVG"; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          if grep -q "octo<test" "$SVG"; then
            echo "ERROR: test fixture data detected in generated SVG."
            exit 1
          fi

          # --------------------------------------------------
          # File sanity check
          # --------------------------------------------------

          size=$(wc -c < "$SVG")

          if [ "$size" -lt 1000 ]; then
            echo "ERROR: Generated SVG is unexpectedly small: ${size} bytes"
            exit 1
          fi

          echo ""
          echo "Git3D V11 SVG validation passed."
          echo "Generated SVG size: ${size} bytes"

      - name: Show generated visualization summary
        shell: bash
        run: |
          echo "========================================"
          echo "Git3D V11 Generated"
          echo "========================================"

          wc -c profile/git3d.svg

          echo ""
          echo "SVG markers:"
          grep -o 'data-role="[^"]*"' profile/git3d.svg | sort -u || true

      - name: Commit updated visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D visualization changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D profile visualization"
          git push
