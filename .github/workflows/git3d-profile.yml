name: Git3D Premium Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ${{ matrix.theme }} Git3D
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: dark
            output: profile/git3d-dark.svg
          - theme: light
            output: profile/git3d-light.svg

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D visualization
        uses: SandeepKomal/git3d-profile@aa7fe5826c11663921a5479e1372929e3ab76c44
        with:
          username: DevopsNimbus
          theme: ${{ matrix.theme }}
          output: ${{ matrix.output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Git3D visualization
        shell: bash
        env:
          SVG: ${{ matrix.output }}
          THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating Git3D ${THEME} theme"
          echo "File: ${SVG}"
          echo "========================================"

          test -f "$SVG"
          test -s "$SVG"

          grep -q "<svg" "$SVG"
          grep -q "</svg>" "$SVG"

          # Identity
          grep -q "DevopsNimbus" "$SVG"
          grep -q "Git3D" "$SVG"

          # V12/V13 Observatory
          grep -q "Contribution Observatory" "$SVG"
          grep -q "CONTRIBUTION" "$SVG"
          grep -q "OBSERVATORY" "$SVG"

          # Structural markers
          grep -q 'data-role="observatory-stage"' "$SVG"
          grep -q 'data-role="perspective-grid"' "$SVG"
          grep -q 'data-role="contribution-terrain"' "$SVG"
          grep -q 'data-role="repository-nodes"' "$SVG"
          grep -q 'data-role="repository-node"' "$SVG"
          grep -q 'data-role="profile-core"' "$SVG"
          grep -q 'data-role="profile-badge"' "$SVG"
          grep -q 'data-role="profile-stats"' "$SVG"
          grep -q 'data-role="stat-card"' "$SVG"

          # Activity telemetry
          grep -q "TOP REPOSITORY" "$SVG"
          grep -q "TOP LANGUAGE" "$SVG"
          grep -q "PEAK / STREAK" "$SVG"

          # Profile metrics
          grep -q "CONTRIBUTIONS" "$SVG"
          grep -q "REPOSITORIES" "$SVG"
          grep -q "STARS" "$SVG"
          grep -q "FORKS" "$SVG"
          grep -q "COLLABORATION" "$SVG"
          grep -q "ACTIVITY SCORE" "$SVG"

          # Ensure old visual hasn't leaked back
          if grep -q "DELIVERY SYSTEM" "$SVG"; then
            echo "ERROR: DELIVERY SYSTEM detected"
            exit 1
          fi

          if grep -q "CONTRIBUTION MATRIX" "$SVG"; then
            echo "ERROR: CONTRIBUTION MATRIX detected"
            exit 1
          fi

          # Ensure fixtures haven't leaked
          if grep -q "testusername" "$SVG"; then
            echo "ERROR: testusername detected"
            exit 1
          fi

          if grep -q "octo&lt;test" "$SVG"; then
            echo "ERROR: octo<test detected"
            exit 1
          fi

          SIZE=$(wc -c < "$SVG")

          echo "SVG size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: SVG is too small"
            exit 1
          fi

          echo "Git3D ${THEME} validation PASSED."

      - name: Upload generated theme
        uses: actions/upload-artifact@v4
        with:
          name: git3d-${{ matrix.theme }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Git3D profile
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Download dark visualization
        uses: actions/download-artifact@v4
        with:
          name: git3d-dark
          path: generated/dark

      - name: Download light visualization
        uses: actions/download-artifact@v4
        with:
          name: git3d-light
          path: generated/light

      - name: Publish generated profiles
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p profile

          # Main README visualization
          cp generated/dark/git3d-dark.svg profile/git3d.svg

          # Alternate premium light theme
          cp generated/light/git3d-light.svg profile/git3d-light.svg

          echo "Published files:"
          ls -lh profile/git3d.svg
          ls -lh profile/git3d-light.svg

      - name: Validate published README target
        shell: bash
        run: |
          set -euo pipefail

          test -s profile/git3d.svg
          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg
          grep -q "Contribution Observatory" profile/git3d.svg

          test -s profile/git3d-light.svg
          grep -q "<svg" profile/git3d-light.svg
          grep -q "DevopsNimbus" profile/git3d-light.svg
          grep -q "Contribution Observatory" profile/git3d-light.svg

          grep -q '\./profile/git3d\.svg' README.md

          echo "README target and published SVGs are valid."

      - name: Commit updated Git3D profiles
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg profile/git3d-light.svg

          if git diff --cached --quiet; then
            echo "No Git3D profile changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D premium profile"
          git push origin HEAD:main

      - name: Publish summary
        shell: bash
        run: |
          echo "========================================"
          echo "Git3D Premium Profile Published"
          echo "========================================"
          echo ""
          echo "README visualization:"
          echo "  profile/git3d.svg"
          echo ""
          echo "Alternate light visualization:"
          echo "  profile/git3d-light.svg"
          echo ""
          echo "Commit/push completed."
