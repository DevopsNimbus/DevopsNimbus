name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D visualization
        uses: SandeepKomal/git3d-profile@e1757441d6b53521b60727233f0a9a13ea8c0394
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg
          grep -q "LIVE ACTIVITY" profile/git3d.svg
          grep -q "PROFILE" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "LANGUAGES" profile/git3d.svg
          grep -q "ACTIVITY" profile/git3d.svg

          echo "Git3D SVG validation passed."

      - name: Show generated visualization summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated SVG:"
          ls -lh profile/git3d.svg

          echo ""
          echo "SVG title:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true

          echo ""
          echo "Activity:"
          grep -o 'LIVE ACTIVITY[^<]*' profile/git3d.svg || true

          echo ""
          echo "Key sections:"
          grep -o '<text[^>]*>PROFILE</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>REPOSITORIES</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>LANGUAGES</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>ACTIVITY</text>' profile/git3d.svg || true

      - name: Commit Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
            exit 0
          fi

          git commit -m "chore: refresh Git3D profile"

          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Git3D profile pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Rebasing again..."
            git pull --rebase origin main
          done

          echo "ERROR: Unable to push Git3D profile after 3 attempts."
          exit 1
