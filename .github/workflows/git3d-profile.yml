name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V7 visualization
        uses: SandeepKomal/git3d-profile@6f43995c6c0912a7e0d7aa6ea27f9c10dcf8b45c
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating Git3D V7 visualization"
          echo "========================================"

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          # Basic SVG validation
          grep -q "<svg" profile/git3d.svg
          grep -q "</svg>" profile/git3d.svg

          # Profile identity
          grep -q "DevopsNimbus" profile/git3d.svg

          # Git3D V7 identity
          grep -q "GIT3D CONTRIBUTION UNIVERSE" profile/git3d.svg
          grep -q "365-DAY CONTRIBUTION LANDSCAPE" profile/git3d.svg

          # V7 contribution visualization
          grep -q "CONTRIBUTION CITY" profile/git3d.svg
          grep -q "365-DAY HISTORY" profile/git3d.svg
          grep -q "HEIGHT = CONTRIBUTION INTENSITY" profile/git3d.svg

          # Terrain components
          grep -q 'data-role="contribution-landscape"' profile/git3d.svg
          grep -q 'data-role="terrain-floor"' profile/git3d.svg
          grep -q 'data-role="terrain-columns"' profile/git3d.svg
          grep -q 'data-role="terrain-peaks"' profile/git3d.svg
          grep -q 'data-role="terrain-guides"' profile/git3d.svg
          grep -q 'data-role="terrain-time"' profile/git3d.svg

          # Activity core
          grep -q "ACTIVITY CORE" profile/git3d.svg

          # Profile signal
          grep -q "PROFILE SIGNAL" profile/git3d.svg
          grep -q "CURRENT STREAK" profile/git3d.svg

          # Primary metrics
          grep -q "CONTRIBUTIONS" profile/git3d.svg
          grep -q "ACTIVE DAYS" profile/git3d.svg
          grep -q "LONGEST STREAK" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "ACTIVITY SCORE" profile/git3d.svg

          # Repository intelligence
          grep -q "TOP REPOSITORY" profile/git3d.svg
          grep -q "PEAK DAY" profile/git3d.svg

          # Original renderer footer
          grep -q "Generated locally by Git3D Profile" profile/git3d.svg

          echo ""
          echo "Git3D V7 SVG validation passed."

      - name: Show generated visualization summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Git3D V7 Generated Visualization"
          echo "========================================"

          echo ""
          echo "Generated SVG:"
          ls -lh profile/git3d.svg

          echo ""
          echo "SVG title:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true

          echo ""
          echo "Git3D:"
          grep -o 'GIT3D CONTRIBUTION UNIVERSE' profile/git3d.svg || true

          echo ""
          echo "Contribution visualization:"
          grep -o 'CONTRIBUTION CITY' profile/git3d.svg || true
          grep -o '365-DAY HISTORY' profile/git3d.svg || true

          echo ""
          echo "Activity core:"
          grep -o 'ACTIVITY CORE' profile/git3d.svg || true

          echo ""
          echo "Profile signal:"
          grep -o 'PROFILE SIGNAL' profile/git3d.svg || true
          grep -o 'CURRENT STREAK' profile/git3d.svg || true

          echo ""
          echo "Metrics:"
          grep -o '<text[^>]*>CONTRIBUTIONS</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>ACTIVE DAYS</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>LONGEST STREAK</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>REPOSITORIES</text>' profile/git3d.svg || true
          grep -o '<text[^>]*>ACTIVITY SCORE</text>' profile/git3d.svg || true

          echo ""
          echo "========================================"
          echo "Git3D V7 summary complete"
          echo "========================================"

      - name: Commit Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
            exit 0
          fi

          git commit -m "chore: refresh Git3D profile"

          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Git3D profile pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Rebasing again..."
            git pull --rebase origin main
          done

          echo "ERROR: Unable to push Git3D profile after 3 attempts."
          exit 1
