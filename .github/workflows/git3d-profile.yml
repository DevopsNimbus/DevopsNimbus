name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D v3 visualization
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated Git3D visualization..."

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Generated SVG still contains testusername."
            exit 1
          fi

          if ! grep -q "DevopsNimbus" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain the repository owner."
            exit 1
          fi

          if ! grep -q "<svg" profile/git3d.svg; then
            echo "ERROR: Generated file is not an SVG."
            exit 1
          fi

          if ! grep -q "activity score" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain the activity score."
            exit 1
          fi

          if ! grep -q "orbit universe" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain the orbit universe."
            exit 1
          fi

          if ! grep -q "depth-based GitHub activity universe" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain Orbit v3 depth metadata."
            exit 1
          fi

          echo "Git3D v3 SVG verification passed."

      - name: Show generated visualization summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated file:"
          ls -lh profile/git3d.svg

          echo ""
          echo "Git3D metadata:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true
          grep -o '· [0-9]* repos · [0-9]* followers · [0-9]* following' profile/git3d.svg || true
          grep -o 'activity score[^<]*' profile/git3d.svg || true

          echo ""
          echo "Orbit v3 markers:"
          grep -o 'depth-based GitHub activity universe' profile/git3d.svg || true
          grep -o 'depthHaze' profile/git3d.svg || true

      - name: Refresh repository before commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          echo "Resetting workspace to latest origin/main..."

          git reset --hard origin/main

      - name: Regenerate Git3D v3 visualization
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          test -s profile/git3d.svg

          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg
          grep -q "activity score" profile/git3d.svg
          grep -q "orbit universe" profile/git3d.svg
          grep -q "depth-based GitHub activity universe" profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Generated SVG contains testusername."
            exit 1
          fi

          echo "Final Git3D v3 visualization verified."

      - name: Commit and push Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
            exit 0
          fi

          git commit -m "chore: refresh Git3D profile"

          git push origin HEAD:main

          echo "Git3D v3 profile pushed successfully."
