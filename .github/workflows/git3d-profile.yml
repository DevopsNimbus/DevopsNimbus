
name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Generate Git3D visualization
        uses: SandeepKomal/git3d-profile@feature/profile-readme-integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: DevopsNimbus
          theme: orbit
          output: profile/git3d.svg

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          test -s profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Generated SVG still contains testusername."
            exit 1
          fi

          if ! grep -q "DevopsNimbus" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain DevopsNimbus."
            exit 1
          fi

          if ! grep -q "<svg" profile/git3d.svg; then
            echo "ERROR: Generated file is not an SVG."
            exit 1
          fi

          echo "Git3D SVG verification passed."

      - name: Commit Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
            exit 0
          fi

          git commit -m "chore: refresh Git3D profile"

          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Git3D profile pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing remote and retrying..."
            git pull --rebase origin main
          done

          echo "ERROR: Unable to push Git3D profile after 3 attempts."
          exit 1

