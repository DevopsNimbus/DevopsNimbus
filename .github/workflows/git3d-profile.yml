name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V9 visualization
        uses: SandeepKomal/git3d-profile@a22e7b324dd9348db46b6c55b754a1fe2fc9b734
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating Git3D V9 visualization"
          echo "========================================"

          # File must exist and contain SVG content
          test -s profile/git3d.svg
          grep -q "<svg" profile/git3d.svg
          grep -q "</svg>" profile/git3d.svg

          # Correct profile identity
          grep -q "DevopsNimbus" profile/git3d.svg

          # V9 identity
          grep -q "GIT3D" profile/git3d.svg
          grep -q "CONTRIBUTION UNIVERSE" profile/git3d.svg
          grep -q "365-DAY ACTIVITY" profile/git3d.svg

          # V9 contribution matrix
          grep -q "CONTRIBUTION MATRIX" profile/git3d.svg
          grep -q "365 DAYS" profile/git3d.svg
          grep -q "X = TIME" profile/git3d.svg
          grep -q "Y = WEEKDAY" profile/git3d.svg
          grep -q "Z = CONTRIBUTION HEIGHT" profile/git3d.svg
          grep -q "DAILY INTENSITY" profile/git3d.svg

          # V9 matrix structure
          grep -q 'data-role="contribution-matrix"' profile/git3d.svg
          grep -q 'data-role="matrix-floor"' profile/git3d.svg
          grep -q 'data-role="matrix-guides"' profile/git3d.svg
          grep -q 'data-role="matrix-columns"' profile/git3d.svg
          grep -q 'data-role="matrix-peaks"' profile/git3d.svg
          grep -q 'data-role="matrix-time"' profile/git3d.svg
          grep -q 'data-role="contribution-cell"' profile/git3d.svg

          # Profile metrics
          grep -q "CONTRIBUTIONS" profile/git3d.svg
          grep -q "ACTIVE DAYS" profile/git3d.svg
          grep -q "CURRENT STREAK" profile/git3d.svg
          grep -q "LONGEST STREAK" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "ACTIVITY SCORE" profile/git3d.svg

          # V9 insights
          grep -q "TOP REPOSITORY" profile/git3d.svg
          grep -q "PEAK DAY" profile/git3d.svg
          grep -q "HEIGHT + LIGHT = DAILY ACTIVITY" profile/git3d.svg

          # Prevent accidental test/default data
          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          # Ensure the generated file is not empty or suspiciously small
          size=$(wc -c < profile/git3d.svg)
          if [ "$size" -lt 1000 ]; then
            echo "ERROR: Generated SVG is unexpectedly small: ${size} bytes"
            exit 1
          fi

          echo "Git3D V9 SVG validation passed."
          echo "Generated SVG size: ${size} bytes"

      - name: Commit updated visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D visualization changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D profile visualization"
          git push
