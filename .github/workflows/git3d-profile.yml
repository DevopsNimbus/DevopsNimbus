name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D v3 visualization
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated Git3D visualization..."

          # File must exist and contain data.
          test -s profile/git3d.svg

          # Prevent stale test data.
          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Generated SVG contains testusername."
            exit 1
          fi

          # Repository owner must be present.
          if ! grep -q "DevopsNimbus" profile/git3d.svg; then
            echo "ERROR: Generated SVG does not contain DevopsNimbus."
            exit 1
          fi

          # Confirm SVG output.
          if ! grep -q "<svg" profile/git3d.svg; then
            echo "ERROR: Generated file is not an SVG."
            exit 1
          fi

          # Confirm activity metadata.
          if ! grep -q "activity score" profile/git3d.svg; then
            echo "ERROR: Activity score is missing."
            exit 1
          fi

          # Confirm Orbit renderer.
          if ! grep -q "orbit universe" profile/git3d.svg; then
            echo "ERROR: Orbit universe marker is missing."
            exit 1
          fi

          # Confirm Orbit v3 depth renderer.
          if ! grep -q "depth-based GitHub activity universe" profile/git3d.svg; then
            echo "ERROR: Orbit v3 depth renderer marker is missing."
            exit 1
          fi

          # Confirm the depth haze used by Orbit v3.
          if ! grep -q "depthHaze" profile/git3d.svg; then
            echo "ERROR: Orbit v3 depthHaze is missing."
            exit 1
          fi

          echo ""
          echo "Git3D v3 verification passed."

      - name: Show generated visualization summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Git3D v3 Generated Visualization"
          echo "========================================"

          echo ""
          echo "File:"
          ls -lh profile/git3d.svg

          echo ""
          echo "Profile:"
          grep -o '<title>[^<]*</title>' profile/git3d.svg || true

          echo ""
          echo "Repository metrics:"
          grep -o '· [0-9]* repos · [0-9]* followers · [0-9]* following' \
            profile/git3d.svg || true

          echo ""
          echo "Activity:"
          grep -o 'activity score[^<]*' \
            profile/git3d.svg || true

          echo ""
          echo "Renderer:"
          grep -o 'orbit universe' \
            profile/git3d.svg || true

          echo ""
          echo "Orbit v3:"
          grep -o 'depth-based GitHub activity universe' \
            profile/git3d.svg || true

          grep -o 'depthHaze' \
            profile/git3d.svg || true

      # Refresh main BEFORE committing the generated artifact.
      # This prevents conflicts with an older generated SVG.
      - name: Refresh repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching latest main..."

          git fetch origin main

          echo "Resetting workspace to latest origin/main..."

          git reset --hard origin/main

      # Generate again after refreshing main so the generated SVG
      # is based on the exact latest repository state.
      - name: Regenerate Git3D v3 visualization
        uses: SandeepKomal/git3d-profile@main
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "Performing final Git3D v3 validation..."

          test -s profile/git3d.svg

          grep -q "<svg" profile/git3d.svg
          grep -q "DevopsNimbus" profile/git3d.svg
          grep -q "activity score" profile/git3d.svg
          grep -q "orbit universe" profile/git3d.svg
          grep -q "depth-based GitHub activity universe" profile/git3d.svg
          grep -q "depthHaze" profile/git3d.svg

          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: Final SVG contains testusername."
            exit 1
          fi

          echo "Final Git3D v3 validation passed."

      - name: Commit and push Git3D visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes detected."
            exit 0
          fi

          git commit -m "chore: refresh Git3D v3 profile"

          echo "Pushing Git3D v3 visualization..."

          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo "Git3D v3 push successful"
          echo "========================================"
