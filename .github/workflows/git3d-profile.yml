name: Git3D Profile V12

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V12 contribution observatory
        uses: SandeepKomal/git3d-profile@f308ca0d72003b726b0f0a3d1cbf519b500ef4f1
        with:
          username: DevopsNimbus
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Git3D V12 visualization
        shell: bash
        run: |
          set -euo pipefail

          SVG="profile/git3d.svg"

          echo "========================================"
          echo "Validating Git3D V12"
          echo "========================================"

          test -s "$SVG"
          grep -q "<svg" "$SVG"
          grep -q "</svg>" "$SVG"

          # Identity
          grep -q "DevopsNimbus" "$SVG"
          grep -q "Git3D" "$SVG"

          # V12 identity
          grep -q "Contribution Observatory" "$SVG"
          grep -q "CONTRIBUTION" "$SVG"
          grep -q "OBSERVATORY" "$SVG"

          # V12 renderer structure
          grep -q 'data-role="observatory-stage"' "$SVG"
          grep -q 'data-role="repository-nodes"' "$SVG"
          grep -q 'data-role="repository-node"' "$SVG"
          grep -q 'data-role="profile-core"' "$SVG"
          grep -q 'data-role="profile-badge"' "$SVG"
          grep -q 'data-role="perspective-grid"' "$SVG"
          grep -q 'data-role="contribution-terrain"' "$SVG"
          grep -q 'data-role="profile-stats"' "$SVG"
          grep -q 'data-role="stat-card"' "$SVG"

          # Activity telemetry
          grep -q "TOP REPOSITORY" "$SVG"
          grep -q "TOP LANGUAGE" "$SVG"
          grep -q "PEAK / STREAK" "$SVG"

          # Profile statistics
          grep -q "CONTRIBUTIONS" "$SVG"
          grep -q "REPOSITORIES" "$SVG"
          grep -q "STARS" "$SVG"
          grep -q "FORKS" "$SVG"
          grep -q "COLLABORATION" "$SVG"
          grep -q "ACTIVITY SCORE" "$SVG"

          # Prevent fixture leakage
          if grep -q "testusername" "$SVG"; then
            echo "ERROR: test fixture username detected."
            exit 1
          fi

          if grep -q "octo<test" "$SVG"; then
            echo "ERROR: test fixture data detected."
            exit 1
          fi

          size=$(wc -c < "$SVG")

          if [ "$size" -lt 1000 ]; then
            echo "ERROR: SVG unexpectedly small: ${size} bytes"
            exit 1
          fi

          echo ""
          echo "Git3D V12 validation passed."
          echo "Generated SVG size: ${size} bytes"

      - name: Show generated visualization summary
        shell: bash
        run: |
          echo "========================================"
          echo "Git3D V12 Contribution Observatory"
          echo "========================================"

          wc -c profile/git3d.svg

          echo ""
          echo "SVG markers:"
          grep -o 'data-role="[^"]*"' profile/git3d.svg | sort -u || true

      - name: Commit updated visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D visualization changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D V12 profile visualization"
          git push
