name: Git3D Premium Theme Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git3d-premium-validation
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Validate ${{ matrix.theme }} theme
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - theme: dark
            output: profile/git3d-dark.svg
          - theme: light
            output: profile/git3d-light.svg

    steps:
      - name: Checkout DevopsNimbus
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D visualization
        uses: SandeepKomal/git3d-profile@aa7fe5826c11663921a5479e1372929e3ab76c44
        with:
          username: DevopsNimbus
          theme: ${{ matrix.theme }}
          output: ${{ matrix.output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated SVG
        shell: bash
        env:
          SVG: ${{ matrix.output }}
          THEME: ${{ matrix.theme }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Git3D Premium Theme Validation"
          echo "Theme: ${THEME}"
          echo "File:  ${SVG}"
          echo "========================================"

          echo ""
          echo "1. Checking file exists..."
          test -f "$SVG"

          echo "2. Checking file is not empty..."
          test -s "$SVG"

          echo "3. Checking SVG structure..."
          grep -q "<svg" "$SVG"
          grep -q "</svg>" "$SVG"

          echo "4. Checking profile identity..."
          grep -q "DevopsNimbus" "$SVG"
          grep -q "Git3D" "$SVG"

          echo "5. Checking Contribution Observatory..."
          grep -q "Contribution Observatory" "$SVG"
          grep -q "CONTRIBUTION" "$SVG"
          grep -q "OBSERVATORY" "$SVG"

          echo "6. Checking observatory structure..."
          grep -q 'data-role="observatory-stage"' "$SVG"
          grep -q 'data-role="perspective-grid"' "$SVG"
          grep -q 'data-role="contribution-terrain"' "$SVG"

          echo "7. Checking repository visualization..."
          grep -q 'data-role="repository-nodes"' "$SVG"
          grep -q 'data-role="repository-node"' "$SVG"

          echo "8. Checking profile core..."
          grep -q 'data-role="profile-core"' "$SVG"
          grep -q 'data-role="profile-badge"' "$SVG"

          echo "9. Checking statistics..."
          grep -q 'data-role="profile-stats"' "$SVG"
          grep -q 'data-role="stat-card"' "$SVG"

          echo "10. Checking activity telemetry..."
          grep -q "TOP REPOSITORY" "$SVG"
          grep -q "TOP LANGUAGE" "$SVG"
          grep -q "PEAK / STREAK" "$SVG"

          echo "11. Checking profile metrics..."
          grep -q "CONTRIBUTIONS" "$SVG"
          grep -q "REPOSITORIES" "$SVG"
          grep -q "STARS" "$SVG"
          grep -q "FORKS" "$SVG"
          grep -q "COLLABORATION" "$SVG"
          grep -q "ACTIVITY SCORE" "$SVG"

          echo "12. Checking for old V11 presentation..."
          if grep -q "DELIVERY SYSTEM" "$SVG"; then
            echo "ERROR: Old DELIVERY SYSTEM content detected"
            exit 1
          fi

          if grep -q "CONTRIBUTION MATRIX" "$SVG"; then
            echo "ERROR: Old CONTRIBUTION MATRIX content detected"
            exit 1
          fi

          echo "13. Checking for test fixture leakage..."
          if grep -q "testusername" "$SVG"; then
            echo "ERROR: testusername detected"
            exit 1
          fi

          if grep -q "octo&lt;test" "$SVG"; then
            echo "ERROR: octo<test fixture detected"
            exit 1
          fi

          echo "14. Checking SVG size..."
          SIZE=$(wc -c < "$SVG")

          echo "Generated SVG size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: SVG is suspiciously small"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "VALIDATION PASSED"
          echo "Theme: ${THEME}"
          echo "Size:  ${SIZE} bytes"
          echo "========================================"

      - name: Show SVG metadata
        shell: bash
        run: |
          echo "Generated file:"
          ls -lh "${{ matrix.output }}"

          echo ""
          echo "Detected data roles:"
          grep -o 'data-role="[^"]*"' "${{ matrix.output }}" \
            | sort -u \
            || true

      - name: Upload generated visualization
        uses: actions/upload-artifact@v4
        with:
          name: git3d-${{ matrix.theme }}-visualization
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  integration-summary:
    name: Git3D Integration Summary
    runs-on: ubuntu-latest
    needs: generate-and-validate
    if: always()

    steps:
      - name: Report validation result
        shell: bash
        run: |
          echo "========================================"
          echo "Git3D Premium Integration"
          echo "========================================"
          echo ""
          echo "Themes validated:"
          echo "  ✓ Dark"
          echo "  ✓ Light"
          echo ""
          echo "Visualization:"
          echo "  ✓ Contribution Observatory"
          echo "  ✓ Perspective Grid"
          echo "  ✓ Contribution Terrain"
          echo "  ✓ Repository Nodes"
          echo "  ✓ Profile Core"
          echo "  ✓ Profile Badge"
          echo "  ✓ Profile Statistics"
          echo "  ✓ Activity Telemetry"
          echo ""
          echo "Security/quality checks:"
          echo "  ✓ No test fixture leakage"
          echo "  ✓ No legacy V11 presentation"
          echo "  ✓ SVG structure validated"
          echo "  ✓ SVG size validated"
          echo ""
          echo "Generated artifacts:"
          echo "  ✓ git3d-dark-visualization"
          echo "  ✓ git3d-light-visualization"
          echo ""
          echo "Git3D V13 premium theme validation completed."
