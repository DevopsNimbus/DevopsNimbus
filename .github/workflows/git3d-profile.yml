name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Git3D V10 visualization
        uses: SandeepKomal/git3d-profile@b2423a757b44f6fb13282a16546610f4ad5e07a5
        with:
          theme: orbit
          output: profile/git3d.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated visualization
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating Git3D V10 visualization"
          echo "========================================"

          # ---------------------------------------------------------
          # Basic SVG validation
          # ---------------------------------------------------------
          test -s profile/git3d.svg

          grep -q "<svg" profile/git3d.svg
          grep -q "</svg>" profile/git3d.svg

          # ---------------------------------------------------------
          # Correct profile identity
          # ---------------------------------------------------------
          grep -q "DevopsNimbus" profile/git3d.svg

          # ---------------------------------------------------------
          # Git3D V10 identity
          # ---------------------------------------------------------
          grep -q "GIT3D" profile/git3d.svg
          grep -q "CONTRIBUTION UNIVERSE" profile/git3d.svg
          grep -q "CODE" profile/git3d.svg
          grep -q "AUTOMATE" profile/git3d.svg
          grep -q "SECURE" profile/git3d.svg
          grep -q "DEPLOY" profile/git3d.svg
          grep -q "OBSERVE" profile/git3d.svg

          # ---------------------------------------------------------
          # V10 orbital universe
          # ---------------------------------------------------------
          grep -q 'data-role="orbital-system"' profile/git3d.svg
          grep -q 'data-role="repository-nodes"' profile/git3d.svg
          grep -q 'data-role="profile-core"' profile/git3d.svg

          # ---------------------------------------------------------
          # Repository information
          # ---------------------------------------------------------
          grep -q "TOP REPOSITORY" profile/git3d.svg
          grep -q "TOP LANGUAGE" profile/git3d.svg
          grep -q "PEAK DAILY ACTIVITY" profile/git3d.svg
          grep -q "LONGEST STREAK" profile/git3d.svg

          # ---------------------------------------------------------
          # Profile statistics
          # ---------------------------------------------------------
          grep -q 'data-role="profile-stats"' profile/git3d.svg

          grep -q "CONTRIBUTIONS" profile/git3d.svg
          grep -q "REPOSITORIES" profile/git3d.svg
          grep -q "STARS" profile/git3d.svg
          grep -q "FORKS" profile/git3d.svg
          grep -q "COLLABORATION" profile/git3d.svg
          grep -q "ACTIVITY SCORE" profile/git3d.svg

          # ---------------------------------------------------------
          # Prevent accidental test/default data
          # ---------------------------------------------------------
          if grep -q "testusername" profile/git3d.svg; then
            echo "ERROR: testusername detected in generated SVG."
            exit 1
          fi

          if grep -q "octo<test" profile/git3d.svg; then
            echo "ERROR: test fixture data detected in generated SVG."
            exit 1
          fi

          # ---------------------------------------------------------
          # File size sanity check
          # ---------------------------------------------------------
          size=$(wc -c < profile/git3d.svg)

          if [ "$size" -lt 1000 ]; then
            echo "ERROR: Generated SVG is unexpectedly small: ${size} bytes"
            exit 1
          fi

          echo ""
          echo "Git3D V10 SVG validation passed."
          echo "Generated SVG size: ${size} bytes"

      - name: Commit updated visualization
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D visualization changes detected."
            exit 0
          fi

          git commit -m "chore: update Git3D profile visualization"
          git push
