name: Git3D Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Git3D Profile
        uses: SandeepKomal/git3d-profile@main
        with:
          username: testusername
          theme: orbit
          output: profile/git3d.svg

      - name: Commit generated visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/git3d.svg

          if git diff --cached --quiet; then
            echo "No Git3D changes."
          else
            git commit -m "chore: generate Git3D profile"
            git push
          fi
